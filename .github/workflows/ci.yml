name: CI

on:
  push:
    branches: [main, dev, stage]
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:

  test-backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Lancer les tests
        run: mvn -B test
        working-directory: recrutplus-backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: recrutplus-frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: recrutplus-frontend

      - name: Lint
        run: npm run lint
        working-directory: recrutplus-frontend

      - name: Build
        run: npm run build
        working-directory: recrutplus-frontend

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Métadonnées backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicolab78/recrutplus-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      - name: Métadonnées frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicolab78/recrutplus-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      - name: Build et push backend
        uses: docker/build-push-action@v6
        with:
          context: ./recrutplus-backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build et push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./recrutplus-frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Scan Trivy backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/nicolab78/recrutplus-backend:${{ github.ref_name }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      - name: Scan Trivy frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/nicolab78/recrutplus-frontend:${{ github.ref_name }}
          format: table
          exit-code: '1'
          severity: CRITICAL

  deploy-staging:
    runs-on: ubuntu-latest
    needs: scan
    if: github.ref == 'refs/heads/stage'
    environment:
      name: staging
      url: https://staging.recrutplus.com
    steps:
      - name: Déploiement staging
        run: echo "Déploiement sur staging de ${{ github.ref_name }}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: scan
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://recrutplus.com
    steps:
      - name: Déploiement production
        run: echo "Déploiement en production de ${{ github.ref_name }}"
